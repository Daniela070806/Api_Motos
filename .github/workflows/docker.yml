name: Construir y subir imagen Spring Boot

on:
  push:
    branches:
      - main

jobs:
  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Crear JAR Spring Boot
        run: mvn clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen
        run: docker build -t daniela070806/api-motos:latest .

      - name: Subir imagen
        run: docker push daniela070806/api-motos:latest

      - name: Actualizar API Spring Boot en EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 98.83.138.39
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull daniela070806/api-motos:latest
            sudo docker stop api-spring || true
            sudo docker rm api-spring || true
            sudo docker run -d \
              --name api-spring \
              --network trabajo-motos_default \
              -p 8080:8080 \
              --restart unless-stopped \
              daniela070806/api-motos:latest
